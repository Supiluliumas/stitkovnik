name: Verify portable packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 build and OCR
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install development dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Build self-contained Windows ZIP
        run: python tools/build_windows_portable.py --sevenzip "C:\Program Files\7-Zip\7z.exe"
      - name: Check embedded runtime, OCR and Excel/CSV export
        run: python -X utf8 tools/check_portable.py dist/Stitkovnik-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Stitkovnik-Windows-x64
          path: |
            dist/Stitkovnik-Windows-x64.zip
            dist/Stitkovnik-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0

  mac:
    name: macOS Apple Silicon build and OCR
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Build self-contained macOS ZIP
        run: python tools/build_portable.py
      - name: Check embedded runtime, OCR and Excel/CSV export
        run: python tools/check_portable.py dist/Stitkovnik-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Stitkovnik-macOS-arm64
          path: |
            dist/Stitkovnik-macOS-arm64.zip
            dist/Stitkovnik-macOS-arm64.zip.sha256
          if-no-files-found: error
          compression-level: 0
